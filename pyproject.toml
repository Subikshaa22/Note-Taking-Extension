[project]
name = "notetaker"
version = "0.1.0"
description = "Distributed YouTube-to-Notion note-taking agent: API gateway, RabbitMQ worker pool, Chrome extension."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
